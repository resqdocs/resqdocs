# CI: Typecheck, Build und Tests der App + geteilten Pakete.
# Laeuft ohne Zugangsdaten und ohne externe Abhaengigkeiten.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pico-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/pico-pwa/package-lock.json
            packages/protocol-core-ui/package-lock.json
      - run: npm ci
      # Die gemeinsamen Editor-Bausteine haben eigene Abhaengigkeiten (vue, @resqdocs/protocol-core);
      # npm test fuehrt auch deren Tests aus.
      - run: npm ci
        working-directory: packages/protocol-core-ui
      - run: npm run build
      - run: npm test
