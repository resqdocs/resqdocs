# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Uebergangsschalter fuer das Android Gradle Plugin 9. Der Upgrade Assistant setzte zehn; fuenf davon braucht
# das Projekt nachweislich nicht (kein resValue, jedes Modul setzt targetSdk, kein <uses-sdk> in den Manifesten,
# kein switch ueber R-Felder, alle Namespaces eindeutig) und sind entfernt. Der Abgleich der Abhaengigkeiten
# (android.dependency.useConstraints) laeuft mit der Voreinstellung von Plugin 9. Uebrig bleiben:
#
# Capacitor 8 und seine Plugins nutzen noch die alte Build-Beschreibung und das eigene Kotlin-Plugin
# (z. B. @capacitor/filesystem). Beide Schalter sind als auslaufend markiert und entfallen mit Plugin 10:
# beim Umstieg auf Capacitor 9 entfernen und neu pruefen.
android.builtInKotlin=false
android.newDsl=false
# Code- und Ressourcen-Verkleinerung (R8) wie unter Plugin 8. Die neuen Voreinstellungen verkleinern
# aggressiver; das aendert den Store-Build und wird getrennt umgestellt und am Geraet geprueft.
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
